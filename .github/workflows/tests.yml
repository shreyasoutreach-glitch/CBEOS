name: CBEOS tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    if: ${{ hashFiles('tests/run_all.py') != '' && hashFiles('tests/test_unit.py') != '' && hashFiles('tests/test_integration.py') != '' && hashFiles('tests/test_security.py') != '' && hashFiles('tests/test_regulatory_import.py') != '' && hashFiles('tests/test_agents.py') != '' && hashFiles('tests/test_demo_render_regression.py') != '' && hashFiles('tests/test_legal_data_pipeline.py') != '' && hashFiles('tests/test_source_governance.py') != '' && hashFiles('tests/test_db_operations.py') != '' && hashFiles('app/db.py') != '' && hashFiles('app/engine.py') != '' && hashFiles('app/server.py') != '' && hashFiles('app/views.py') != '' && hashFiles('app/agents.py') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit
      - run: python -m compileall -q app tools tests
      - run: python tests/run_all.py
