name: CBEOS tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    # Guard against publishing/testing a partial tree while the source is being brought over.
    # Once the runnable app and test runner exist, normal pushes execute the full gates.
    if: ${{ hashFiles('tests/run_all.py') != '' && hashFiles('app/db.py') != '' && hashFiles('app/engine.py') != '' && hashFiles('app/views.py') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit
      - run: python -m compileall -q app tools tests
      - run: python tests/run_all.py
