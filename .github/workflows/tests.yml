name: CBEOS tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit
      - run: python -m compileall -q app tools tests
      - run: python tests/run_all.py
      - name: Smoke-test deployed Render sandbox
        if: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/meg-sprint/verified-client-outcomes-2026-10-10') || (github.event_name == 'pull_request' && github.head_ref == 'meg-sprint/verified-client-outcomes-2026-10-10') }}
        timeout-minutes: 12
        env:
          BASE_URL: https://cbeos-sandbox.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          last_error = "No attempt made"

          def get(path, timeout=12):
              request = urllib.request.Request(
                  base + path,
                  headers={"User-Agent": "CBEOS-sandbox-smoke/1.0"},
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return response.status, response.read().decode("utf-8", "replace"), response.geturl()

          for attempt in range(1, 41):
              try:
                  status, body, _ = get("/healthz")
                  assert status == 200 and json.loads(body).get("ok") is True, f"/healthz unexpected response: {status} {body[:200]}"

                  status, body, _ = get("/readyz")
                  assert status == 200 and json.loads(body).get("ready") is True, f"/readyz unexpected response: {status} {body[:200]}"

                  status, body, _ = get("/login")
                  assert status == 200 and "Sign in to CBEOS" in body and "Less chasing." in body, f"/login did not serve the expected CBEOS onboarding page: {status}"

                  status, body, final_url = get("/")
                  assert status == 200 and final_url.rstrip("/").endswith("/login"), f"Unauthenticated / should redirect to /login, got {status} {final_url}"
                  assert "Sandbox boundary" in body, "Login page is missing the sandbox safety boundary"

                  print("PASS: deployed Render sandbox smoke test")
                  print("  /healthz: healthy")
                  print("  /readyz: database schema ready")
                  print("  /login: redesigned onboarding page served")
                  print("  /: unauthenticated access redirects to login")
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  last_error = f"{type(exc).__name__}: {exc}"
                  print(f"Attempt {attempt}/40: {last_error}")
                  if attempt < 40:
                      time.sleep(15)

          raise SystemExit(f"Deployed Render sandbox smoke test failed after retries: {last_error}")
          PY
